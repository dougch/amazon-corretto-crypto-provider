name: ACCP release build

# Builds the unsigned non-FIPS linux jar. Signing and publishing are added in later steps.
# Only manually triggered: release jobs will run on runners that hold signing secrets,
# so this workflow must never run on pull_request or pull_request_target.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build linux-x86_64 (non-FIPS)
    # Swap to the CodeBuild runner label once the fleet exists:
    # codebuild-accp-gha-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Corretto 17 is the build JDK: it exposes the javax.crypto.KEM API needed to
      # compile the ML-KEM Multi-Release overlay. The jar still targets JDK 8.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build
        run: ./gradlew -DFIPS=false build src_jar javadoc

      - name: Record jar hashes
        run: |
          cd build/lib
          sha256sum *.jar | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accp-linux-x86_64
          path: build/lib/*.jar
          if-no-files-found: error
