name: ACCP test signing

# Exercises the JCE jarsigner and GPG signing paths with throwaway keys generated per run.
# The jars this produces are NOT releasable: the JCE cert is self-signed, so OracleJDK will refuse
# to load them as a provider. Only manually triggered; never run on pull_request or pull_request_target.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sign-linux:
    name: Test-sign linux-x86_64 (non-FIPS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'corretto'

      # build.gradle reads the keystore from the Gradle user home and the password from
      # KEYSTORE_PASSWORD. JKS matches the format of the production keystore.
      - name: Generate throwaway JCE keystore
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          mkdir -p ~/.gradle
          keytool -genkeypair -alias accp-test -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=ACCP test signing" -storetype JKS -keystore ~/.gradle/accp-test.jks \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD"

      - name: Generate throwaway GPG key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "ACCP test signing <accp-test@invalid>" rsa3072 sign 1d
          gpg --armor --export accp-test@invalid > accp-test-gpg.pub

      # Tests are covered by the release build workflow; this run only exercises signing.
      - name: Build and JCE-sign
        run: ./gradlew -DFIPS=false -PjcecertAlias=accp-test -PjcecertJks=accp-test.jks release_jars -x test

      - name: Verify JCE signature
        run: |
          jar=build/release/AmazonCorrettoCryptoProvider-*-linux-x86_64.jar
          jarsigner -verify -verbose -certs $jar | tee jarsigner.log | tail -20
          grep -q "jar verified" jarsigner.log
          grep -q 'Signed by "CN=ACCP test signing"' jarsigner.log

      - name: GPG-sign and verify
        run: |
          cd build/release
          for f in *.jar; do
            gpg --batch --armor --detach-sign --local-user accp-test@invalid "$f"
            gpg --batch --verify "$f.asc" "$f"
          done

      - name: Record hashes
        run: |
          cd build/release
          sha256sum *.jar *.asc | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accp-test-signed-linux-x86_64
          path: |
            build/release/*.jar
            build/release/*.asc
            accp-test-gpg.pub
          if-no-files-found: error
